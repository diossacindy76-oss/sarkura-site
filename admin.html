<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkura 订单管理后台</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{
  background:
    radial-gradient(60% 45% at 85% 8%, rgba(224,163,189,.10) 0%, transparent 60%),
    radial-gradient(55% 45% at 10% 90%, rgba(201,168,118,.08) 0%, transparent 60%),
    linear-gradient(165deg,#0d0b14 0%,#131019 48%,#181225 100%);
  background-attachment:fixed;min-height:100vh
}
.hd{background:rgba(13,11,20,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(230,210,190,.14);color:#eae4f0;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hd h1{font-size:18px;font-weight:800;background:linear-gradient(120deg,#e0a3bd,#e8c98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .badge{background:rgba(232,201,138,.14);border:1px solid rgba(232,201,138,.3);color:#e8c98a;padding:3px 10px;border-radius:999px;font-size:12px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card .time{font-size:12px;color:#7d7591}
.tag{font-size:11px;padding:2px 10px;border-radius:999px;font-weight:600}
.tag.new{background:rgba(242,109,109,.14);color:#f26d6d}
.tag.contacted{background:rgba(232,201,138,.14);color:#e8c98a}
.tag.done{background:rgba(52,211,153,.14);color:#34d399}
.row{font-size:14px;color:#a79fb3;margin-bottom:5px;line-height:1.5}
.row b{color:#eae4f0}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;padding:8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btns .c{background:rgba(232,201,138,.12);color:#e8c98a;border:1px solid rgba(232,201,138,.25)}
.btns .c:hover{background:rgba(232,201,138,.22)}
.btns .d{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.25)}
.btns .d:hover{background:rgba(52,211,153,.22)}
.btns .del{background:rgba(242,109,109,.12);color:#f26d6d;border:1px solid rgba(242,109,109,.25)}
.btns .del:hover{background:rgba(242,109,109,.22)}
.empty{text-align:center;color:#7d7591;padding:50px 0;font-size:14px}
.login{max-width:380px;margin:80px auto;background:rgba(255,255,255,.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(230,210,190,.16);border-radius:20px;padding:34px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 40px rgba(224,163,189,.06)}
.login h2{font-size:20px;margin-bottom:22px;text-align:center;background:linear-gradient(120deg,#e0a3bd,#e8c98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.login input{width:100%;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(230,210,190,.14);border-radius:12px;font-size:15px;margin-bottom:12px;outline:none;color:#eae4f0;transition:border-color .2s,box-shadow .2s}
.login input::placeholder{color:#7d7591}
.login input:focus{border-color:#c9a876;box-shadow:0 0 0 3px rgba(201,168,118,.15)}
.login button{width:100%;padding:13px;background:linear-gradient(135deg,#c9a876,#e0a3bd);color:#0d0b14;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;transition:.25s;box-shadow:0 10px 26px rgba(201,168,118,.25)}
.login button:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(201,168,118,.35)}
.login .err{color:#f26d6d;font-size:13px;text-align:center;margin-top:10px;display:none}
.btn-plain{background:none;border:none;color:#a79fb3;font-size:14px;cursor:pointer;text-decoration:underline;transition:color .2s}
.btn-plain:hover{color:#e8c98a}
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:14px;padding:12px;text-align:center}
.stat .n{font-size:22px;font-weight:800;background:linear-gradient(120deg,#eae4f0,#e8c98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:12px;color:#7d7591}
.rev{background:linear-gradient(135deg,rgba(201,168,118,.16),rgba(224,163,189,.10));border:1px solid rgba(230,210,190,.18);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;color:#eae4f0}
.rev .l{font-size:13px;color:#a79fb3}
.rev .total{font-size:26px;font-weight:800;color:#e8c98a;margin-top:2px}
.rev .sub{font-size:12px;color:#a79fb3;text-align:right;line-height:1.7}
.rev .sub b{color:#eae4f0}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:14px;padding:6px}
.tab{flex:1;padding:10px 6px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:600;color:#a79fb3;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(135deg,#c9a876,#e0a3bd);color:#0d0b14}
.tab .bdg{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;margin-left:4px}
.tab:not(.active) .bdg{background:rgba(232,201,138,.14);color:#e8c98a}
.cmt-card{background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:16px;padding:14px;margin-bottom:12px}
.cmt-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cmt-card .name{font-weight:700;color:#eae4f0;font-size:14px}
.cmt-card .name::before{content:'💬 '}
.cmt-card .time{font-size:12px;color:#7d7591}
.cmt-card .txt{font-size:14px;color:#a79fb3;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.usr-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.usr-row:hover{border-color:rgba(201,168,118,.4);box-shadow:0 4px 14px rgba(201,168,118,.1)}
.usr-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#0d0b14;background:linear-gradient(135deg,#c9a876,#e0a3bd)}
.usr-info{flex:1;min-width:0}
.usr-name{font-weight:600;color:#eae4f0;font-size:15px}
.usr-time{color:#7d7591;font-size:12px;margin-top:2px}
.usr-cnt{text-align:right;flex-shrink:0}
.usr-cnt b{color:#e8c98a;font-weight:700;font-size:14px}
.usr-cnt span{color:#7d7591;font-size:11px}</style>
</head>
<body>
<div class="hd" id="hd" style="display:none">
  <h1>📋 Sarkura 订单管理</h1>
  <button class="btn-plain" onclick="logout()">退出</button>
</div>

<!-- 登录 -->
<div class="login" id="loginView">
  <h2>🔐 管理员登录</h2>
  <input type="email" id="loginEmail" placeholder="管理员邮箱">
  <input type="password" id="loginPwd" placeholder="密码">
  <button onclick="login()">登 录</button>
  <div class="err" id="loginErr">邮箱或密码错误</div>
</div>

<!-- 订单列表 -->
<div class="wrap" id="adminView" style="display:none">
  <div class="tabs">
    <button class="tab active" id="tabOrders" onclick="switchTab('orders')">📋 订单</button>
    <button class="tab" id="tabComments" onclick="switchTab('comments')">💬 评论<span class="bdg" id="cmtBadge">0</span></button>
    <button class="tab" id="tabUsers" onclick="switchTab('users')">👥 用户<span class="bdg" id="usrBadge">0</span></button>
    <button class="tab" id="tabDraw" onclick="switchTab('draw')">🎁 抽奖<span class="bdg" id="drawBadge">0</span></button>
  </div>
  <div id="ordersPane">
  <div class="rev">
    <div><div class="l">💰 总营收</div><div class="total" id="revTotal">¥0</div></div>
    <div class="sub">已完成 <b id="revDone">¥0</b><br>共 <b id="revCount">0</b> 单</div>
  </div>
  <div class="stat">
    <div><div class="n" id="stNew">0</div><div class="l">新订单</div></div>
    <div><div class="n" id="stContacted">0</div><div class="l">已联系</div></div>
    <div><div class="n" id="stDone">0</div><div class="l">已完成</div></div>
  </div>
  <div class="rev" style="margin-top:12px;background:linear-gradient(135deg,rgba(201,168,118,.14),rgba(224,163,189,.08));border:1px solid rgba(230,210,190,.2)">
    <div>
      <div class="l">🔥 内部卡验证</div>
      <div id="icStatus" style="font-size:15px;font-weight:700;color:#e8c98a;margin-top:2px">检查中…</div>
      <div style="font-size:11.5px;color:#a79fb3;margin-top:3px">本月限量 1 张 · 锁定后下单内部卡的用户会被拦截</div>
    </div>
    <div style="display:flex;gap:8px;flex-direction:column;min-width:130px">
      <button onclick="icLock()" id="icLockBtn" style="padding:9px 12px;border:none;border-radius:10px;background:rgba(242,109,109,.16);color:#f26d6d;border:1px solid rgba(242,109,109,.3);font-size:13px;font-weight:700;cursor:pointer">🔒 标记本月已售完</button>
      <button onclick="icUnlock()" id="icUnlockBtn" style="padding:9px 12px;border:none;border-radius:10px;background:rgba(52,211,153,.16);color:#34d399;border:1px solid rgba(52,211,153,.3);font-size:13px;font-weight:700;cursor:pointer">🔓 解锁（下月开售）</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">暂无订单，客户提交后会显示在这里</div>
  </div>
  <div id="commentsPane" style="display:none">
    <div class="stat">
      <div><div class="n" id="cmtTotal">0</div><div class="l">总评论</div></div>
      <div><div class="n" id="cmtToday">0</div><div class="l">今日新增</div></div>
    </div>
    <div id="cmtList"></div>
    <div class="empty" id="cmtEmpty" style="display:none">暂无评论，访客留言后会显示在这里</div>
  </div>
  <div id="usersPane" style="display:none">
    <div class="stat">
      <div><div class="n" id="usrTotal">0</div><div class="l">总用户</div></div>
      <div><div class="n" id="usrToday">0</div><div class="l">今日新增</div></div>
    </div>
    <div id="usrList"></div>
    <div class="empty" id="usrEmpty" style="display:none">暂无注册用户</div>
  </div>
  <div id="drawPane" style="display:none">
    <div class="stat">
      <div><div class="n" id="drawTotal">0</div><div class="l">本月报名</div></div>
      <div><div class="n" id="drawWinCount">0</div><div class="l">已开奖月份</div></div>
    </div>
    <div style="font-size:13px;font-weight:700;color:#eae4f0;margin:14px 0 8px">📥 本月报名者（由你定夺中奖者）</div>
    <div id="drawList"></div>
    <div class="empty" id="drawEmpty" style="display:none">本月还没有人报名</div>
    <div style="font-size:13px;font-weight:700;color:#eae4f0;margin:18px 0 8px">🏆 中奖公示（每月保留，前端同步展示）</div>
    <div id="drawWinList"></div>
  </div>
</div>

<!-- 用户联系方式弹窗 -->
<div id="contactMask" style="display:none;position:fixed;inset:0;background:rgba(5,4,10,.72);backdrop-filter:blur(6px);z-index:99;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)closeContact()">
  <div style="background:#1a1526;border:1px solid rgba(230,210,190,.16);border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55)">
    <div id="ctAvatar" style="width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:linear-gradient(135deg,#c9a876,#e0a3bd)"></div>
    <div id="ctName" style="font-size:17px;font-weight:700;color:#eae4f0;margin-bottom:6px"></div>
    <div id="ctContact" style="font-size:14px;color:#a79fb3;margin-bottom:14px;word-break:break-all"></div>
    <button onclick="closeContact()" style="padding:8px 22px;border:none;border-radius:10px;background:rgba(255,255,255,.08);color:#eae4f0;font-size:14px;cursor:pointer;transition:.2s">关 闭</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wpcwssdlxuxfgxsrfjtn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_81wwjNdQlR-8i9Sp1auHeg_RyzeW-yc';

function api(path, opts){
  return fetch(SUPABASE_URL + path, Object.assign({
    headers: {'apikey': SUPABASE_KEY, 'Content-Type': 'application/json'}
  }, opts));
}

function priceOf(service){
  const m = String(service||'').match(/¥(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}
function fmt(n){
  n = Math.round(n*100)/100;
  return '¥' + n;
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  document.getElementById('loginErr').style.display = 'none';
  try{
    const r = await api('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({email, password: pwd})
    });
    if(!r.ok) throw new Error('bad login');
    const d = await r.json();
    localStorage.setItem('sb_token', d.access_token);
    showAdmin();
  }catch(e){
    document.getElementById('loginErr').style.display = 'block';
  }
}

const IC_TABLE = 'ic_lock';
async function icCheck(){
  const token = localStorage.getItem('sb_token');
  if(!token) return;
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + IC_TABLE + '?select=locked,updated_at&limit=1', {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token}
    });
    if(r.ok){
      const arr = await r.json();
      const locked = !!(arr && arr.length && arr[0].locked);
      const st = document.getElementById('icStatus');
      if(arr && arr.length){
        const t = new Date(arr[0].updated_at);
        const ts = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
        st.textContent = locked ? ('🔒 已售完（' + ts + ' 起拦截下单）') : '✅ 可售（未锁定）';
      } else {
        st.textContent = '⚠️ 开关表为空（请先执行数据库 SQL）';
      }
      st.style.color = locked ? '#f26d6d' : (arr && arr.length ? '#34d399' : '#e8c98a');
      document.getElementById('icLockBtn').disabled = locked;
      document.getElementById('icUnlockBtn').disabled = !locked;
    } else if(r.status === 404){
      document.getElementById('icStatus').textContent = '⚠️ 需要先在 Supabase 执行 SQL 建表';
      document.getElementById('icStatus').style.color = '#e8c98a';
    }
  }catch(e){}
}
async function icLock(){
  const token = localStorage.getItem('sb_token');
  if(!token) return;
  if(!confirm('确定标记内部卡本月已售完？之后下单内部卡的用户会被拦截提示。')) return;
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + IC_TABLE + '?id=eq.1', {
    method: 'PATCH',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
    body: JSON.stringify({locked: true, updated_at: new Date().toISOString()})
  });
  if(r.ok){ alert('已锁定：内部卡本月售完，下单将提示「下个月再来吧」'); icCheck(); }
  else alert('锁定失败（' + r.status + '）：请确认已在 Supabase 执行建表 SQL');
}
async function icUnlock(){
  const token = localStorage.getItem('sb_token');
  if(!token) return;
  if(!confirm('确定解锁内部卡？解除售完拦截，允许继续下单。')) return;
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + IC_TABLE + '?id=eq.1', {
    method: 'PATCH',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
    body: JSON.stringify({locked: false, updated_at: new Date().toISOString()})
  });
  if(r.ok){ alert('已解锁：内部卡恢复可售'); icCheck(); }
  else alert('解锁失败（' + r.status + '）：请确认已在 Supabase 执行建表 SQL');
}

async function loadOrders(){
  const token = localStorage.getItem('sb_token');
  if(!token) { showLogin(); return; }
  const r = await fetch(SUPABASE_URL + '/rest/v1/orders?select=*&order=created_at.desc', {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token}
  });
  if(r.status === 401){ localStorage.removeItem('sb_token'); showLogin(); return; }
  const orders = await r.json();
  render(orders);
}

function render(orders){
  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('stNew').textContent = orders.filter(o=>o.status==='new').length;
  document.getElementById('stContacted').textContent = orders.filter(o=>o.status==='contacted').length;
  document.getElementById('stDone').textContent = orders.filter(o=>o.status==='done').length;
  const total = orders.reduce((s,o)=>s+priceOf(o.service),0);
  const doneAmt = orders.filter(o=>o.status==='done').reduce((s,o)=>s+priceOf(o.service),0);
  document.getElementById('revTotal').textContent = fmt(total);
  document.getElementById('revDone').textContent = fmt(doneAmt);
  document.getElementById('revCount').textContent = orders.length;
  if(!orders.length){ document.getElementById('empty').style.display='block'; return; }
  document.getElementById('empty').style.display='none';
  const tagMap = {new:'新订单', contacted:'已联系', done:'已完成'};
  const clsMap = {new:'new', contacted:'contacted', done:'done'};
  orders.forEach(o=>{
    const t = new Date(o.created_at);
    const time = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="top"><span class="time">${time}</span><span class="tag ${clsMap[o.status]}">${tagMap[o.status]||o.status}</span></div>
      <div class="row"><b>款式：</b>${o.service} <span style="color:#e8c98a;font-weight:700">${priceOf(o.service)?fmt(priceOf(o.service)):''}</span></div>
      <div class="row"><b>图案：</b>${o.style||'—'}</div>
      <div class="row"><b>说明：</b>${o.detail||'—'}</div>
      <div class="row"><b>联系方式：</b>${o.contact}</div>
      <div class="btns">
        <button class="c" onclick="setStatus(${o.id},'contacted')">✓ 已联系</button>
        <button class="d" onclick="setStatus(${o.id},'done')">✓ 已完成</button>
        <button class="del" onclick="delOrder(${o.id})">🗑 删除</button>
      </div>`;
    list.appendChild(div);
  });
}

async function setStatus(id, status){
  const token = localStorage.getItem('sb_token');
  await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + id, {
    method: 'PATCH',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
    body: JSON.stringify({status})
  });
  loadOrders();
}

async function delOrder(id){
  if(!confirm('确定删除这条订单吗？删除后不可恢复！')) return;
  const token = localStorage.getItem('sb_token');
  const r = await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + id, {
    method: 'DELETE',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Prefer': 'return=minimal'}
  });
  if(r.ok){
    loadOrders();
  }else{
    alert('删除失败（' + r.status + '），请刷新重试');
  }
}


function switchTab(t){
  document.getElementById('tabOrders').className = 'tab' + (t==='orders'?' active':'');
  document.getElementById('tabComments').className = 'tab' + (t==='comments'?' active':'');
  document.getElementById('ordersPane').style.display = t==='orders'?'block':'none';
  document.getElementById('commentsPane').style.display = t==='comments'?'block':'none';
  if(t==='comments') loadComments();
  document.getElementById('usersPane').style.display = t==='users'?'block':'none';
  if(t==='users') loadUsers();
  document.getElementById('tabDraw').className = 'tab' + (t==='draw'?' active':'');
  document.getElementById('drawPane').style.display = t==='draw'?'block':'none';
  if(t==='draw') loadDraw();
}

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadComments(){
  const token = localStorage.getItem('sb_token');
  if(!token){ showLogin(); return; }
  const r = await fetch(SUPABASE_URL + '/rest/v1/comments?select=*&order=created_at.desc&limit=200', {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token}
  });
  if(r.status === 401){ localStorage.removeItem('sb_token'); showLogin(); return; }
  const cs = await r.json();
  document.getElementById('cmtBadge').textContent = cs.length;
  renderComments(cs);
}

function renderComments(cs){
  document.getElementById('cmtTotal').textContent = cs.length;
  const today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('cmtToday').textContent = cs.filter(c=>new Date(c.created_at)>=today).length;
  const list = document.getElementById('cmtList');
  list.innerHTML = '';
  document.getElementById('cmtEmpty').style.display = cs.length?'none':'block';
  cs.forEach(c=>{
    const t = new Date(c.created_at);
    const time = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    const div = document.createElement('div');
    div.className = 'cmt-card';
    div.innerHTML = `
      <div class="head">
        <span class="name">${esc(c.nickname||'匿名')}</span>
        <span class="time">${time}</span>
      </div>
      <div class="txt">${esc(c.content)}</div>
      <div class="btns">
        <button class="del" onclick="delComment(${c.id})">🗑 删除</button>
      </div>`;
    list.appendChild(div);
  });
}

async function delComment(id){
  if(!confirm('确定删除这条评论吗？删除后不可恢复！')) return;
  const token = localStorage.getItem('sb_token');
  const r = await fetch(SUPABASE_URL + '/rest/v1/comments?id=eq.' + id, {
    method: 'DELETE',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Prefer': 'return=minimal'}
  });
  if(r.ok) loadComments();
  else alert('删除失败（' + r.status + '），请刷新重试');
}

function logout(){ localStorage.removeItem('sb_token'); showLogin(); }
function showAdmin(){ document.getElementById('loginView').style.display='none'; document.getElementById('adminView').style.display='block'; document.getElementById('hd').style.display='flex'; loadOrders(); loadComments(); icCheck(); }
function showLogin(){ document.getElementById('loginView').style.display='block'; document.getElementById('adminView').style.display='none'; document.getElementById('hd').style.display='none'; }

if(localStorage.getItem('sb_token')) showAdmin(); else showLogin();

/* ---- 用户管理 ---- */
const AVATAR_COLORS = [
  'linear-gradient(135deg,#c9a876,#e8c98a)',
  'linear-gradient(135deg,#e0a3bd,#c98ba6)',
  'linear-gradient(135deg,#7fb3d5,#5b8db8)',
  'linear-gradient(135deg,#5ec9a0,#3f9d7c)',
  'linear-gradient(135deg,#a78bda,#7d63b8)',
  'linear-gradient(135deg,#e8c98a,#e0a3bd)'
];
function avatarStyle(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function fmtDate(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const p = n => String(n).padStart(2,'0');
  return (sameDay ? '今天 ' : '') + d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()) + ' ' + p(d.getHours())+':'+p(d.getMinutes());
}
async function loadUsers(){
  const token = localStorage.getItem('sb_token');
  if(!token){ showLogin(); return; }
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/admin_list_users', {
    method: 'POST',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: '{}'
  });
  if(r.status === 401){ localStorage.removeItem('sb_token'); showLogin(); return; }
  let d = null;
  try{ d = await r.json(); }catch(e){}
  if(!d || !d.ok){ document.getElementById('usrList').innerHTML = '<div class="empty">加载失败，请刷新重试</div>'; return; }
  const us = d.users || [];
  document.getElementById('usrBadge').textContent = us.length;
  document.getElementById('usrTotal').textContent = us.length;
  const today = new Date().toDateString();
  document.getElementById('usrToday').textContent = us.filter(u => u.created_at && new Date(u.created_at).toDateString() === today).length;
  const list = document.getElementById('usrList');
  document.getElementById('usrEmpty').style.display = us.length ? 'none' : 'block';
  if(!us.length){ list.innerHTML = ''; return; }
  list.innerHTML = us.map(u =>
    '<div class="usr-row" data-id="' + u.id + '" data-name="' + esc(u.username) + '">' +
      '<div class="usr-av">' + esc((u.username||'?').slice(0,1)) + '</div>' +
      '<div class="usr-info">' +
        '<div class="usr-name">' + esc(u.username) + '</div>' +
        '<div class="usr-time">' + fmtDate(u.created_at) + '</div>' +
      '</div>' +
      '<div class="usr-cnt"><b>' + (u.comment_count||0) + '</b><span>条留言</span></div>' +
    '</div>'
  ).join('');
  list.onclick = function(e){
    const row = e.target.closest ? e.target.closest('.usr-row') : null;
    if(row){ showContact(row.getAttribute('data-id'), row.getAttribute('data-name')); }
  };
}
async function showContact(id, name){
  const token = localStorage.getItem('sb_token');
  if(!token){ showLogin(); return; }
  document.getElementById('ctAvatar').textContent = (name||'?').slice(0,1);
  document.getElementById('ctAvatar').style.background = avatarStyle(name||'?');
  document.getElementById('ctName').textContent = name;
  document.getElementById('ctContact').textContent = '联系方式加载中…';
  document.getElementById('contactMask').style.display = 'flex';
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/admin_get_user_contact', {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({p_user_id: id})
    });
    const d = await r.json();
    document.getElementById('ctContact').textContent = (d && d.ok) ? ('📞 ' + d.contact) : ((d && d.msg) || '获取失败');
  }catch(e){
    document.getElementById('ctContact').textContent = '获取失败，请重试';
  }
}
function closeContact(){ document.getElementById('contactMask').style.display = 'none'; }


/* ===== 抽奖管理（报名者 + 定夺中奖 + 公示） ===== */
async function loadDraw(){
  const token = localStorage.getItem('sb_token');
  if(!token){ showLogin(); return; }
  const h = {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token};
  const d = new Date();
  const m = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  const r1 = await fetch(SUPABASE_URL + '/rest/v1/draw_entries?select=*&month=eq.' + m + '&order=created_at.desc', {headers: h});
  if(r1.status === 401){ localStorage.removeItem('sb_token'); showLogin(); return; }
  const es = await r1.json();
  document.getElementById('drawTotal').textContent = es.length;
  document.getElementById('drawBadge').textContent = es.length;
  document.getElementById('drawBadge').style.display = es.length ? 'inline-block' : 'none';
  const list = document.getElementById('drawList');
  if(!es.length){ document.getElementById('drawEmpty').style.display='block'; list.innerHTML=''; }
  else{
    document.getElementById('drawEmpty').style.display='none';
    list.innerHTML = es.map(e =>
      '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:13px">' +
      '<div style="font-weight:700;color:#eae4f0">' + esc(e.name) + ' <span style="color:#7d7591;font-weight:400">微信 ' + esc(e.wechat) + '</span></div>' +
      '<div style="color:#7d7591;font-size:12px;margin:4px 0 8px">' + String(e.created_at||'').replace('T',' ').slice(0,16) + ' 报名</div>' +
      '<button onclick="winDraw(' + e.id + ',\'' + esc(e.name) + '\',\'' + esc(e.wechat) + '\',\'' + m + '\')" style="background:linear-gradient(120deg,#c9a876,#e0a3bd);color:#0d0b14;border:none;padding:7px 16px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(201,168,118,.25)">🏆 设为本月中奖者</button>' +
      '</div>').join('');
  }
  const r2 = await fetch(SUPABASE_URL + '/rest/v1/draw_winners?select=*&order=month.desc', {headers: h});
  const ws = await r2.json();
  document.getElementById('drawWinCount').textContent = ws.length;
  const wl = document.getElementById('drawWinList');
  if(!ws.length){ wl.innerHTML = '<div class="empty">还没有开过奖</div>'; }
  else{
    wl.innerHTML = ws.map(w =>
      '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(230,210,190,.13);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:13px">' +
      '<div style="font-weight:700;color:#eae4f0">' + esc(w.month) + ' <span style="color:#e8c98a">🎉 ' + esc(w.name) + '</span> <span style="color:#7d7591;font-weight:400">微信 ' + esc(w.wechat) + '</span></div>' +
      '<div style="color:#7d7591;font-size:12px;margin:4px 0 0">' + String(w.created_at||'').replace('T',' ').slice(0,16) + '</div>' +
      '<button onclick="delWin(' + w.id + ')" style="margin-top:8px;background:rgba(242,109,109,.12);color:#f26d6d;border:1px solid rgba(242,109,109,.25);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer">删除</button>' +
      '</div>').join('');
  }
}
async function winDraw(id, name, wechat, month){
  if(!confirm('确认 ' + name + ' 为本月（' + month + '）中奖用户？将同步公示到前端')) return;
  const token = localStorage.getItem('sb_token');
  const r = await fetch(SUPABASE_URL + '/rest/v1/draw_winners', {method:'POST',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
    body: JSON.stringify({month: month, name: name, wechat: wechat, note: '每月抽奖'})});
  if(r.ok){ alert('✅ 已设为中奖，前端公示已更新'); loadDraw(); }
  else { alert('设置失败：本月可能已开过奖（每月限 1 名）。如要换人请先删除原公示'); }
}
async function delWin(id){
  if(!confirm('删除这条中奖公示？（前端公示将同步消失）')) return;
  const token = localStorage.getItem('sb_token');
  const r = await fetch(SUPABASE_URL + '/rest/v1/draw_winners?id=eq.' + id, {method:'DELETE',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Prefer':'return=minimal'}});
  if(r.ok) loadDraw();
}
